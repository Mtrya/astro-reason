name: verifier_exposure
mode: batch

benchmarks:
  - benchmark: stereo_imaging
    split: test
    cases:
      - case_0001
      - case_0002
      - case_0003
      - case_0004
      - case_0005
  - benchmark: satnet
    split: test
    cases:
      - W10_2018
      - W20_2018
      - W30_2018
      - W40_2018
      - W50_2018
exposures:
  - transparent
  # - opaque # Will not run opaque again for it's already been run in the main_agentic experiment
  - none
harnesses:
  - codex
  - opencode_dpsk

timeout_seconds: 7200

batch:
  max_concurrency: 2
  max_retries: 1
  skip_completed: true
  retry_statuses:
    - runner_error
    - timeout
    - agent_failed

resources:
  cpus: 8
  memory: 32g
  shm_size: 16g

results:
  root: results/agent_runs/experiments/verifier_exposure
  aggregate_dir: summaries
