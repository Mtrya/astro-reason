id: regional_coverage_celf_submodular
benchmark: regional_coverage
solver: celf_submodular
solver_path: solvers/regional_coverage/celf_submodular
evidence_type: reproduced_solver
runnable: true
setup_script: setup.sh
solve_script: solve.sh
solution_filename: solution.json
aggregate_metrics:
  - name: coverage_ratio
    source: verifier.metrics.coverage_ratio
  - name: weighted_coverage_ratio
    source: verifier.metrics.weighted_coverage_ratio
  - name: num_actions
    source: verifier.metrics.num_actions
  - name: min_battery_wh
    source: verifier.metrics.min_battery_wh
  - name: execution_mode
    source: solver_status.execution_mode
  - name: solver_timing_total_s
    source: solver_status.timing_seconds.total
  - name: timing_case_parsing_s
    source: solver_status.timing_seconds.wall_phases.case_parsing
  - name: timing_coverage_index_s
    source: solver_status.timing_seconds.wall_phases.coverage_index
  - name: timing_candidate_generation_s
    source: solver_status.timing_seconds.wall_phases.candidate_generation
  - name: timing_search_s
    source: solver_status.timing_seconds.wall_phases.search
  - name: timing_solution_writing_s
    source: solver_status.timing_seconds.wall_phases.solution_writing
  - name: timing_debug_writing_s
    source: solver_status.timing_seconds.wall_phases.debug_writing
  - name: timing_local_validation_s
    source: solver_status.timing_seconds.wall_phases.local_validation
  - name: candidate_execution_model
    source: solver_status.candidate_summary.execution_model
  - name: candidate_worker_count
    source: solver_status.candidate_summary.worker_count
  - name: candidate_count
    source: solver_status.candidate_summary.candidate_count
  - name: positive_coverage_candidate_count
    source: solver_status.candidate_summary.positive_coverage_candidate_count
  - name: evaluated_candidate_count
    source: solver_status.candidate_summary.evaluated_candidate_count
  - name: propagated_window_count
    source: solver_status.candidate_summary.propagated_window_count
  - name: cached_state_sample_reuse_count
    source: solver_status.candidate_summary.cached_state_sample_reuse_count
  - name: search_configured_run_count
    source: solver_status.search_summary.configured_run_count
  - name: search_completed_run_count
    source: solver_status.search_summary.completed_run_count
  - name: search_best_seed
    source: solver_status.search_summary.best_seed
  - name: search_stop_reason
    source: solver_status.search_summary.stop_reason
  - name: greedy_random_choice_probability
    source: solver_status.greedy_summary.random_choice_probability
  - name: greedy_random_choices
    source: solver_status.greedy_summary.random_choices
  - name: local_search_iterations
    source: solver_status.local_search_summary.iterations
  - name: local_search_attempted_moves
    source: solver_status.local_search_summary.attempted_moves
  - name: local_search_accepted_moves
    source: solver_status.local_search_summary.accepted_moves
  - name: local_search_stop_reason
    source: solver_status.local_search_summary.stop_reason
config:
  candidate_generation:
    time_stride_s: 150
    max_candidates_total: 518400
    cap_strategy: balanced_stride
    debug_candidate_limit: 5
  coverage_mapping:
    method: indexed
    spatial_bin_deg: 0.25
    worker_count: auto
    chunk_size: 4096
  selection:
    schedule_aware: true
    local_improvement: true
    local_improvement_max_passes: 12
    local_improvement_max_candidate_checks: 1500
    local_improvement_worker_count: auto
    local_improvement_chunk_size: 16
    compute_online_bounds: true
    max_bound_order_debug: 10
    write_iteration_trace: false
    max_iteration_debug: 100
run_policies:
  quality_probe_stride150_full:
    description: Strongest verified fixed-candidate CELF envelope.
    quality_envelope:
      level: quality_ready
      status: READY_QUALITY_FAIR
      claim: faithful benchmark-adapted CELF/CEF reproduction under a meaningful fixed-candidate optimization envelope
      non_humble_parameters: true
      scope:
        - fixed benchmark-adapted strip candidate set
        - schedule-aware CELF/CEF selection
        - bounded fixed-candidate local improvement
        - deterministic parallel coverage mapping and local-improvement evaluation
        - experiment-owned verifier validation on test/case_0001
      remaining_limit: quality-ready claim is scoped to the fixed candidate set and test/case_0001; it does not certify continuous-schedule optimality or all regional-coverage cases
    cases:
      - test/case_0001
cases:
  - id: test/case_0001
    case_dir: benchmarks/regional_coverage/dataset/cases/test/case_0001
  - id: test/case_0002
    case_dir: benchmarks/regional_coverage/dataset/cases/test/case_0002
  - id: test/case_0003
    case_dir: benchmarks/regional_coverage/dataset/cases/test/case_0003
  - id: test/case_0004
    case_dir: benchmarks/regional_coverage/dataset/cases/test/case_0004
  - id: test/case_0005
    case_dir: benchmarks/regional_coverage/dataset/cases/test/case_0005
verifier:
  command:
    - uv
    - run
    - python
    - benchmarks/regional_coverage/verifier.py
    - "{case_dir}"
    - "{solution_path}"
