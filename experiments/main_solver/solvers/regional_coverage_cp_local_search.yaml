    source: solver_status.candidate_summary.cached_state_sample_reuse_count
  - name: search_configured_run_count
    source: solver_status.search_summary.configured_run_count
  - name: search_completed_run_count
    source: solver_status.search_summary.completed_run_count
  - name: search_best_seed
    source: solver_status.search_summary.best_seed
  - name: search_stop_reason
    source: solver_status.search_summary.stop_reason
  - name: greedy_random_choice_probability
    source: solver_status.greedy_summary.random_choice_probability
  - name: greedy_random_choices
    source: solver_status.greedy_summary.random_choices
  - name: local_search_iterations
    source: solver_status.local_search_summary.iterations
  - name: local_search_attempted_moves
    source: solver_status.local_search_summary.attempted_moves
  - name: local_search_accepted_moves
    source: solver_status.local_search_summary.accepted_moves
  - name: local_search_stop_reason
    source: solver_status.local_search_summary.stop_reason
  - name: cp_backend
    source: solver_status.cp_summary.backend
  - name: cp_sat_version
    source: solver_status.cp_summary.cp_sat_version
  - name: cp_calls
    source: solver_status.cp_summary.calls
  - name: cp_successful_calls
    source: solver_status.cp_summary.successful_calls
  - name: cp_call_success_rate
    source: solver_status.cp_summary.call_success_rate
  - name: cp_improving_solutions
    source: solver_status.cp_summary.improving_solutions
  - name: cp_improving_success_rate
    source: solver_status.cp_summary.improving_success_rate
  - name: cp_model_build_time_s
    source: solver_status.cp_summary.model_build_time_s
  - name: cp_solve_time_s
