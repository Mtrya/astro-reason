id: revisit_constellation_rgt_apc_gap_constructive
benchmark: revisit_constellation
solver: rgt_apc_gap_constructive
solver_path: solvers/revisit_constellation/rgt_apc_gap_constructive
evidence_type: reproduced_solver
runnable: true
setup_script: setup.sh
solve_script: solve.sh
solution_filename: solution.json
aggregate_metrics:
  - name: num_satellites
    source: verifier.metrics.num_satellites
  - name: capped_max_revisit_gap_hours
    source: verifier.metrics.capped_max_revisit_gap_hours
  - name: worst_target_capped_max_revisit_gap_hours
    source: verifier.metrics.worst_target_capped_max_revisit_gap_hours
  - name: max_revisit_gap_hours
    source: verifier.metrics.max_revisit_gap_hours
  - name: threshold_violation_count
    source: verifier.metrics.threshold_violation_count
  - name: solver_timing_total_s
    source: solver_status.timing_seconds.total
evaluation_policy:
  profile: fair_public_reproduction
  purpose: "Faithful RGT/APC constructive reproduction adapted to revisit_constellation public cases."
  compute_envelope:
    expected_smoke_wall_time_seconds: 120
    expected_public_case_wall_time_seconds: 900
    visibility_worker_count: auto_bounded_to_8
    measured_smoke_case_0001_solve_seconds: 109.9
    measured_smoke_case_0001_verifier_seconds: 22.7
    deterministic: true
  notes:
    - "Experiment-owned profile; solver registry remains CI/contract metadata only."
    - "RGT/APC candidate pool is broader than the final satellite cap."
    - "Official validity is established only through the experiment-owned verifier command below."
config:
  active_profile: smoke
  compute_envelope:
    profile_class: smoke
    intended_use: contract_and_official_smoke
    deterministic: true
    expected_case_wall_time_seconds: 120
    worker_count_policy: auto_bounded_visibility_workers
    measured_reference:
      case_id: test/case_0001
      date_utc: "2026-04-29"
      solve_wall_time_seconds: 109.9
      verifier_wall_time_seconds: 22.7
      capped_max_revisit_gap_hours: 9.345108695652174
      blocker: remaining_expected_revisit_threshold_violations
  orbit_library:
    max_candidates: 36
    search_mode: minmax_architecture
    max_rgt_days: 3
    min_revolutions_per_day: 10
    max_revolutions_per_day: 18
    raan_slot_count: 2
    phase_slot_count: null
    max_shells: 6
    max_closure_error_m: 5000.0
    j2_closure_tolerance_m: 5000.0
    j2_refinement_iterations: 6
    fallback_altitude_count: 3
  visibility:
