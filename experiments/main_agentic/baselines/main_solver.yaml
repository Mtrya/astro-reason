source: experiments/main_solver/README.md
source_commit: e07f0161ea5d4bb83099ac68131f1a31124c8698
description: >
  Main-solver baseline rows copied from the Main Result Matrix tables. Radar
  plotting computes reader-facing normalized scores from these benchmark-native
  metrics, then compares main-agentic harness scores against the best normalized
  solver score for the same benchmark case.
notes:
  - SPOT5 normalized_score divides computed_profit by the unconstrained
    max_profit for the case, computed as the sum of candidate profits in the
    .spot instance file.
  - Regional Coverage rows include num_actions from a regenerated
    results/main_solver/summary.json because the README table documents the
    coverage and battery metrics but omits action count.

normalization:
  satnet:
    u_rms_cap: 1.0
    u_max_cap: 1.0
  relay_constellation:
    min_added_satellites: 0
    latency_cap_ms: 1000.0
  revisit_constellation:
    min_satellites: 1
  regional_coverage:
    battery_capacity_mode: max_satellite_capacity_wh

