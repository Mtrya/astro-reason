name: memory_accumulation
mode: batch
condition: cross_benchmark_round_robin_v1

accumulation:
  harnesses:
    - codex
    - opencode_dpsk
    - opencode_minimax
  train_cases:
    - stereo_imaging/train/case_0001
    - revisit_constellation/train/case_0001
    - relay_constellation/train/case_0001
    - regional_coverage/train/case_0001
    - aeossp_standard/train/case_0001
    - spot5/train/507
    - stereo_imaging/train/case_0002
    - revisit_constellation/train/case_0002
    - relay_constellation/train/case_0002
    - regional_coverage/train/case_0002
    - aeossp_standard/train/case_0002
    - spot5/train/54

evaluation:
  memory_sources:
    - codex
    - opencode_dpsk
    - opencode_minimax
  harnesses:
    - codex
    - opencode_dpsk
    - opencode_minimax
  benchmarks:
    - benchmark: satnet
      split: test
      cases:
        - W10_2018
        - W20_2018
        - W30_2018
        - W40_2018
        - W50_2018
    - benchmark: regional_coverage
      split: test
      cases:
        - case_0001
        - case_0002
        - case_0003
        - case_0004
        - case_0005
    - benchmark: relay_constellation
      split: test
      cases:
        - case_0001
        - case_0002
        - case_0003
        - case_0004
        - case_0005

timeout_seconds: 7200

batch:
  max_concurrency: 2
  max_retries: 1
  skip_completed: true
  retry_statuses:
    - runner_error
    - timeout
    - agent_failed

resources:
  cpus: 8
  memory: 32g
  shm_size: 16g

results:
  root: results/agent_runs/experiments/memory_accumulation
  aggregate_dir: summaries

fragments:
  root: experiments/_fragments/memory_accumulation
